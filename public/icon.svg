<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="#10b981" stroke-width="6" opacity="0.3" />

  <!-- WiFi Waves -->
  <path d="M96 200 C180 120, 332 120, 416 200" fill="none" stroke="url(#neonEmerald)" stroke-width="32" stroke-linecap="round" />
  <path d="M144 260 C206 200, 306 200, 368 260" fill="none" stroke="url(#neonEmerald)" stroke-width="28" stroke-linecap="round" />
  <path d="M192 320 C228 280, 284 280, 320 320" fill="none" stroke="url(#neonEmerald)" stroke-width="24" stroke-linecap="round" />

  <!-- Center Hub / Coin -->
  <circle cx="256" cy="385" r="42" fill="url(#goldCoin)" stroke="#fef3c7" stroke-width="8" />
  <text x="256" y="398" font-size="34" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle" fill="#78350f">Rp</text>
</svg>
